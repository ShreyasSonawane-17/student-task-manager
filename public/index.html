<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Luxury • Student Academic Task Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">

    <!-- Premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Luxury Application Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- React 18, ReactDOM 18, Remix Router & React Router DOM 6 UMD -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@remix-run/router@1.19.2/dist/router.umd.js"></script>
    <script crossorigin src="https://unpkg.com/react-router@6.26.2/dist/umd/react-router.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-router-dom@6.26.2/dist/umd/react-router-dom.production.min.js"></script>

    <!-- Fallback CDN Mirrors if unpkg is slow or restricted -->
    <script>
        if (!window.React) {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"><\/script>');
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"><\/script>');
        }
    </script>

    <!-- Babel Standalone for In-Browser JSX Compilation -->
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
</head>

<body>
    <!-- React Root Mount Point -->
    <div id="root">
        <div class="initial-loader">
            <div class="loader-crest">✨</div>
            <h2>TaskFlow Luxury</h2>
            <p>Initializing Student Academic Suite...</p>
        </div>
    </div>

    <!-- Main React Application Script (Compiled by Babel Standalone) -->
    <script type="text/babel" data-presets="react" src="script.js"></script>

    <!-- Fallback Diagnostic Notice in case of file:// protocol CORS restriction -->
    <script>
        setTimeout(function() {
            var root = document.getElementById("root");
            if (root && root.querySelector(".initial-loader") && window.location.protocol === "file:") {
                root.innerHTML = '<div class="initial-loader" style="padding: 40px; text-align: center; max-width: 600px; margin: 0 auto;">' +
                    '<div class="loader-crest" style="color: #f59e0b;">✨</div>' +
                    '<h2 style="color: #f8fafc; font-size: 22px; margin-bottom: 8px;">Run with Node Server for Full Experience</h2>' +
                    '<p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">' +
                    'You are viewing this file via <code>file://</code> protocol. Browser security policies restrict Babel from reading script.js from file origin.' +
                    '</p>' +
                    '<div style="background: #11182c; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 16px; text-align: left; font-family: monospace; color: #fbbf24; font-size: 13px; margin-bottom: 20px;">' +
                    '> npm start<br>' +
                    'Server running at http://localhost:3000' +
                    '</div>' +
                    '<a href="http://localhost:3000" style="background: linear-gradient(135deg, #4f46e5, #6366f1); color: white; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block;">Open http://localhost:3000</a>' +
                    '</div>';
            }
        }, 3000);
    </script>
</body>

</html>
